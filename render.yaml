services:
  # Backend API
  - type: web
    name: designflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false # postgresql+psycopg://user:pass@host:5432/db (Render Postgres "Internal Database URL", with +psycopg added)
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # the frontend URL, e.g. https://designflow-web.onrender.com
      - key: SEED_STAFF_PASSWORD
        sync: false
      - key: SEED_CLIENT_PASSWORD
        sync: false
      - key: JIRA_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false # the frontend URL; used in client review links
      - key: SMTP_HOST
        sync: false # optional: enables email notifications, digests and review emails
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION_NAME
        value: auto
      - key: S3_BUCKET_NAME
        value: designflow-cdr

  # Frontend static site
  - type: web
    name: designflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # the API URL, e.g. https://designflow-api.onrender.com
