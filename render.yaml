databases:
  - name: designflow-db
    plan: free
    databaseName: designflow

services:
  # Backend API
  - type: web
    name: designflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: designflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # the frontend URL, e.g. https://designflow-web.onrender.com
      # Production keeps demo accounts/tickets OUT. Only a separate demo deployment sets SEED_DEMO_DATA=true
      # (and then SEED_STAFF_PASSWORD / SEED_CLIENT_PASSWORD). See DEPLOY.md.
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_EMAIL
        value: mcciaexplore@gmail.com # promoted to Design Lead (admin) on every deploy
      - key: ADMIN_PASSWORD
        sync: false # only used to create the account if it does not exist yet; the admin then adds everyone else in Settings > Users
      - key: JIRA_WEBHOOK_SECRET
        sync: false
      - key: JIRA_BASE_URL
        sync: false # optional: https://your-domain.atlassian.net
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false # optional: enables confirmation and reminder emails
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false # optional: CAPTCHA on the public request form
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false # the frontend URL; used in client review links
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION_NAME
        value: auto
      - key: S3_BUCKET_NAME
        value: designflow-cdr

  # Frontend static site
  - type: web
    name: designflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # the API URL, e.g. https://designflow-api.onrender.com
