services:
  # Backend API
  - type: web
    name: designflow-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION_NAME
        value: auto
      - key: S3_BUCKET_NAME
        value: designflow-cdr
      - key: CRON_SECRET
        sync: false

  # Frontend Static Site
  - type: web
    name: designflow-web
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: designflow-api
          property: url
